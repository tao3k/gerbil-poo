name: Scheme
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: scheme-${{ github.ref }}
  cancel-in-progress: true
env:
  GERBIL_PATH: ${{ github.workspace }}/.ci-library
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
      source-key: ${{ steps.library-cache.outputs.cache-primary-key }}
      binary-key: ${{ steps.library-bytes.outputs.key }}
      compiler-key: ${{ steps.compiler.outputs.identity }}
      test-key: ${{ steps.groups.outputs.test-key }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-gerbil
      - name: Validate every test module and emit its functional group
        id: groups
        env:
          TEST_SOURCE_KEY: ${{ hashFiles('t/*-test.ss') }}
        run: |
          matrix="$(gxi t/test-matrix.ss)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "test-key=$TEST_SOURCE_KEY" >> "$GITHUB_OUTPUT"
      - name: Identify the C toolchain used by the released compiler
        id: compiler
        run: |
          identity="$( { cc --version; ld --version; uname -m; } | sha256sum | cut -d ' ' -f 1)"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: library-cache
        with:
          path: |
            .ci-library/lib
            .ci-library/build-source-key
            .ci-library/producer-revision
            .ci-library/poo-build-owner.scm
            .ci-library/poo-build-shared.scm
          key: scheme-library-v2-${{ runner.os }}-${{ runner.arch }}-143c691fee5af4f9f631fd339f69a66f562e42e0bfc1d4ee2cda5fa8d35c35ee-${{ steps.compiler.outputs.identity }}-${{ hashFiles('*.ss', 'support/**/*.ss', 'examples/**/*.ss', 't/**/*.ss', '!t/*-test.ss', 'gerbil.pkg', 'justfile', '.github/workflows/test.yml', '.github/actions/setup-gerbil/action.yml') }}
      - name: Compile the shared Scheme modules once
        if: steps.library-cache.outputs.cache-hit != 'true'
        run: GERBIL_BUILD_SCOPE=library just build
      - name: Record or verify the exact compiled source
        env:
          SOURCE_KEY: ${{ steps.library-cache.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.library-cache.outputs.cache-hit }}
        run: |
          if test "$CACHE_HIT" = true; then
            test "$(cat .ci-library/build-source-key)" = "$SOURCE_KEY"
            test -d .ci-library/lib/clan/poo
          else
            printf '%s\n' "$SOURCE_KEY" > .ci-library/build-source-key
            git rev-parse HEAD > .ci-library/producer-revision
          fi
          git rev-parse HEAD > .ci-library/revision
          echo "Checked source: $SOURCE_KEY"
          echo "Compiler output produced at: $(cat .ci-library/producer-revision)"
      - name: Bind test caches to the exact shared compiler outputs
        id: library-bytes
        run: |
          set -euo pipefail
          identity="$(find .ci-library/lib -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
          echo "key=$identity" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: steps.library-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .ci-library/lib
            .ci-library/build-source-key
            .ci-library/producer-revision
            .ci-library/poo-build-owner.scm
            .ci-library/poo-build-shared.scm
          key: ${{ steps.library-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheme-library-${{ github.sha }}
          path: .ci-library
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true
  compile-tests:
    name: compile ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-gerbil
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scheme-library-${{ github.sha }}
          path: .ci-library
      - name: Require this run's checked revision
        run: test "$(cat .ci-library/revision)" = "$(git rev-parse HEAD)"
      - name: Require the shared library's C toolchain
        env:
          EXPECTED_COMPILER: ${{ needs.build.outputs.compiler-key }}
        run: |
          set -euo pipefail
          actual="$( { cc --version; ld --version; uname -m; } | sha256sum | cut -d ' ' -f 1)"
          test "$actual" = "$EXPECTED_COMPILER"
      - uses: actions/cache/restore@v4
        id: tests-cache
        with:
          path: .ci-tests/${{ matrix.group }}
          key: scheme-tests-${{ needs.build.outputs.source-key }}-${{ needs.build.outputs.binary-key }}-${{ needs.build.outputs.test-key }}-${{ matrix.group }}-${{ matrix.source-key }}
      - name: Compile this group's tests against the shared library
        if: steps.tests-cache.outputs.cache-hit != 'true'
        env:
          GERBIL_BUILD_SCOPE: tests
          GERBIL_BUILD_TEST_GROUP: ${{ matrix.group }}
          GERBIL_BUILD_LIBDIR: ${{ github.workspace }}/.ci-tests/${{ matrix.group }}/lib
        run: just build
      - name: Admit exact compiled test sources and stamp this revision
        env:
          BASE_KEY: ${{ needs.build.outputs.source-key }}-${{ needs.build.outputs.binary-key }}-${{ needs.build.outputs.test-key }}
          TEST_GROUP: ${{ matrix.group }}
          CACHE_HIT: ${{ steps.tests-cache.outputs.cache-hit }}
        run: |
          mode=record
          if test "$CACHE_HIT" = true; then mode=verify; fi
          gxi t/build-artifacts.ss "$mode" "$BASE_KEY" "$(git rev-parse HEAD)" "$TEST_GROUP"
      - uses: actions/cache/save@v4
        if: steps.tests-cache.outputs.cache-hit != 'true'
        with:
          path: .ci-tests/${{ matrix.group }}
          key: scheme-tests-${{ needs.build.outputs.source-key }}-${{ needs.build.outputs.binary-key }}-${{ needs.build.outputs.test-key }}-${{ matrix.group }}-${{ matrix.source-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheme-tests-${{ github.sha }}-${{ matrix.group }}
          overwrite: true
          path: .ci-tests
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  test:
    name: ${{ matrix.group }}
    needs: [build, compile-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-gerbil
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scheme-library-${{ github.sha }}
          path: .ci-library
      - name: Require this run's checked revision
        run: test "$(cat .ci-library/revision)" = "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scheme-tests-${{ github.sha }}-${{ matrix.group }}
          path: .ci-tests
      - name: Require this run's admitted group and exact source
        env:
          BASE_KEY: ${{ needs.build.outputs.source-key }}-${{ needs.build.outputs.binary-key }}-${{ needs.build.outputs.test-key }}
          TEST_GROUP: ${{ matrix.group }}
        run: gxi t/build-artifacts.ss check "$BASE_KEY" "$(git rev-parse HEAD)" "$TEST_GROUP"
      - name: Install this admitted test group
        run: cp -a .ci-tests/${{ matrix.group }}/lib/. .ci-library/lib/
      - name: Run independent Scheme module tests
        run: printf '%s\n' ${{ matrix.modules }} | xargs -P 2 -n 1 just test-file
  single-process:
    needs: [build, compile-tests]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-gerbil
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scheme-library-${{ github.sha }}
          path: .ci-library
      - name: Require this run's checked revision
        run: test "$(cat .ci-library/revision)" = "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: scheme-tests-${{ github.sha }}-*
          path: .ci-tests
          merge-multiple: true
      - name: Require complete disjoint groups and the current source revision
        env:
          BASE_KEY: ${{ needs.build.outputs.source-key }}-${{ needs.build.outputs.binary-key }}-${{ needs.build.outputs.test-key }}
        run: |
          gxi t/build-artifacts.ss collect "$BASE_KEY" "$(git rev-parse HEAD)"
          for group in .ci-tests/*; do cp -a "$group/lib/." .ci-library/lib/; done
      - name: Run the entire suite in one bounded process
        run: just _test t 300
