name: Scheme
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: scheme-${{ github.ref }}
  cancel-in-progress: true
env:
  GERBIL_PATH: ${{ github.workspace }}/.ci-library
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-gerbil
      - name: Validate every test module and emit its functional group
        id: groups
        run: |
          matrix="$(gxi t/test-groups.ss)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Compile the Scheme modules once
        run: just build
      - name: Record the actual producer revision
        run: git rev-parse HEAD > .ci-library/revision
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheme-library-${{ github.sha }}
          path: .ci-library
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true
  test:
    name: ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-gerbil
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scheme-library-${{ github.sha }}
          path: .ci-library
      - name: Require this run's exact producer revision
        run: test "$(cat .ci-library/revision)" = "$(git rev-parse HEAD)"
      - name: Run independent Scheme module tests
        run: printf '%s\n' ${{ matrix.modules }} | xargs -P 2 -n 1 just test-file
