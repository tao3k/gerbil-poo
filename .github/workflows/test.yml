name: Scheme
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: scheme-${{ github.ref }}
  cancel-in-progress: true
env:
  GERBIL_PATH: ${{ github.workspace }}/.ci-library
  # Standard compile/job progress; level 9 additionally traces each optimizer call.
  GERBIL_BUILD_VERBOSE: 3
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # One worker uses the synchronous compiler path in std/make.
      # The asynchronous shared build failed with a worker stack overflow.
      GERBIL_BUILD_CORES: '1'
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
      compiler-key: ${{ steps.gerbil.outputs.compiler-key }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-gerbil
        id: gerbil
      - name: Enumerate declared test packages
        id: groups
        run: |
          printf '%s\n' t/*/gerbil.pkg | jq -Rsc 'split("\n") | map(select(length > 0) | split("/")[1]) | {group: .}' > "$RUNNER_TEMP/groups.json"
          echo "matrix=$(cat "$RUNNER_TEMP/groups.json")" >> "$GITHUB_OUTPUT"
      # Cache compiled libraries and the linked representation programs.
      - uses: actions/cache@v4
        id: shared-cache
        with:
          path: |
            .ci-library/lib
            .ci-library/bin
          key: scheme-shared-${{ runner.os }}-${{ runner.arch }}-${{ steps.gerbil.outputs.compiler-key }}-${{ hashFiles('**/*.ss', '**/*.scm', '**/gerbil.pkg', 'justfile', '.github/workflows/test.yml', '.github/actions/setup-gerbil/action.yml') }}
      - name: Check public module packaging
        run: just check-layout
      - name: Prepare the declared libraries and benchmark programs
        if: steps.shared-cache.outputs.cache-hit != 'true'
        run: just build-shared
      - name: Check shared and isolated build declarations
        run: just test-file t/build-test.ss
      - name: Run the source example TestSuites
        run: just test-file examples/generated-traces.ss
      - name: Preserve standard executable permissions for artifact transfer
        run: tar -cf "$RUNNER_TEMP/scheme-shared.tar" -C .ci-library lib bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheme-library-${{ github.sha }}
          path: ${{ runner.temp }}/scheme-shared.tar
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  test:
    name: ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-gerbil
        id: gerbil
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scheme-library-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore standard executable permissions
        run: mkdir -p .ci-library && tar -xf "$RUNNER_TEMP/scheme-shared.tar" -C .ci-library
      - name: Require the shared compiler and host dependencies
        run: test '${{ steps.gerbil.outputs.compiler-key }}' = '${{ needs.build.outputs.compiler-key }}'
      - name: Discover and run this package with the official test runner
        run: just test-group '${{ matrix.group }}'
  representation-entry:
    name: representation entry
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-gerbil
        id: gerbil
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scheme-library-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore standard executable permissions
        run: mkdir -p .ci-library && tar -xf "$RUNNER_TEMP/scheme-shared.tar" -C .ci-library
      - name: Require the shared compiler and host dependencies
        run: test '${{ steps.gerbil.outputs.compiler-key }}' = '${{ needs.build.outputs.compiler-key }}'
      - name: Exercise linked and runtime-loaded entries, including refusals
        run: just _test benchmarks/representation-startup.ss
      - name: Check the paired Slot index workloads
        run: just _test benchmarks/slot-index-test.ss
  benchmark-studies:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-gerbil
        id: gerbil
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scheme-library-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore standard executable permissions
        run: mkdir -p .ci-library && tar -xf "$RUNNER_TEMP/scheme-shared.tar" -C .ci-library
      - name: Require the shared compiler and host dependencies
        run: test '${{ steps.gerbil.outputs.compiler-key }}' = '${{ needs.build.outputs.compiler-key }}'
      - name: Run the paired collection and generator studies
        run: |
          just _run-collections 2 1 4
          just _run-generators 8 2
      - name: Check certified Graph work and preserved paired controls
        # Each independent benchmark Module owns its interned fixture names.
        # Each benchmark runs with its existing workload and heap limit.
        run: |
          just _build-root benchmarks/closure
          just _test -r '^cold-handoff-contract-test$' "$GERBIL_PATH/lib/clan/poo/benchmarks/cold-handoff-test.ssi"
          just _test benchmarks/scc-test.ss
          just _test benchmarks/owned-invalidation-test.ss
          just benchmark-dense-repair-built natural
          just benchmark-dense-repair-built collected
