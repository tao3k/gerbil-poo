name: Scheme
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: scheme-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Compile the Scheme modules once
        run: bazel build //:library --disk_cache=${{ runner.temp }}/scheme-build-cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheme-build-cache
          path: ${{ runner.temp }}/scheme-build-cache
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true
  test:
    name: ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group:
          - objects
          - representations
          - collections
          - methods
          - declarations
          - closure
          - construction
          - components
          - feedback
          - recursion
          - contracts
          - publication
          - revisions
          - coordination
          - recovery
          - generalized
          - tools
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scheme-build-cache
          path: ${{ runner.temp }}/scheme-build-cache
      - name: Run independent Scheme module tests
        run: bazel test //:${{ matrix.group }} --disk_cache=${{ runner.temp }}/scheme-build-cache --local_test_jobs=2
      - name: Retain failed module diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-${{ matrix.group }}
          path: bazel-testlogs/**/test.log
          retention-days: 3
          if-no-files-found: ignore
          overwrite: true
