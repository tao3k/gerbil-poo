name: Scheme
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: scheme-${{ github.ref }}
  cancel-in-progress: true
env:
  GERBIL_PATH: ${{ github.workspace }}/.ci-library
  GERBIL_BUILD_VERBOSE: 9
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-gerbil
        id: gerbil
      - name: Enumerate declared test packages
        id: groups
        run: |
          printf '%s\n' t/*/gerbil.pkg | jq -Rsc 'split("\n") | map(select(length > 0) | split("/")[1]) | {group: .}' > "$RUNNER_TEMP/groups.json"
          echo "matrix=$(cat "$RUNNER_TEMP/groups.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: shared-cache
        with:
          path: |
            .ci-library/lib
            .ci-library/bin
          key: scheme-shared-${{ runner.os }}-${{ runner.arch }}-${{ steps.gerbil.outputs.compiler-key }}-${{ hashFiles('**/*.ss', '**/*.scm', '**/gerbil.pkg', 'justfile', '.github/actions/setup-gerbil/action.yml', '!t/*/*-test.ss') }}
      - name: Prepare the declared libraries and benchmark programs
        if: steps.shared-cache.outputs.cache-hit != 'true'
        run: time -p just build-shared
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheme-library-${{ github.sha }}
          path: .ci-library
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  compile-tests:
    name: compile ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-gerbil
        id: gerbil
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scheme-library-${{ github.sha }}
          path: .ci-library
      - name: Compile the standard test package
        run: just build-group '${{ matrix.group }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheme-tests-${{ github.sha }}-${{ matrix.group }}
          # The first wildcard preserves the package directory in the artifact.
          path: .ci-library/lib/clan/poo/t/*/**
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  test:
    name: ${{ matrix.group }}
    needs: [build, compile-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-gerbil
        id: gerbil
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scheme-library-${{ github.sha }}
          path: .ci-library
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scheme-tests-${{ github.sha }}-${{ matrix.group }}
          path: .ci-library/lib/clan/poo/t
      - name: Discover and run this package with the official test runner
        run: just test-group '${{ matrix.group }}'
  representation-entry:
    name: representation entry
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-gerbil
        id: gerbil
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scheme-library-${{ github.sha }}
          path: .ci-library
      - name: Exercise linked and runtime-loaded entries, including refusals
        run: just benchmark-representation-startup
  single-process:
    needs: [build, compile-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/setup-gerbil
        id: gerbil
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scheme-library-${{ github.sha }}
          path: .ci-library
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: scheme-tests-${{ github.sha }}-*
          path: .ci-library/lib/clan/poo/t
          merge-multiple: true
      - name: Run every compiled suite in one process and the complete paired study
        run: time -p just check-built 2 1 4
